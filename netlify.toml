[build]
  base = "Site"
  command = "bun run build"
  publish = "dist"
  # Releases are handled by GitHub Actions and the host.
  ignore = "exit 0"

# Universal Links: Apple fetches this extensionless path and requires
# Content-Type: application/json.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
