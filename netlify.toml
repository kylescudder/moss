[build]
  base = "Site"
  command = "bun run build"
  publish = "dist"
  # Skip deploys unless the site or its Netlify configuration changed.
  ignore = "git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ../netlify.toml"

# Universal Links: Apple fetches this extensionless path and requires
# Content-Type: application/json.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
