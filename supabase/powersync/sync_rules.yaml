# PowerSync Sync Streams for Moss. Tombstones remain replicated; app queries hide them.
config:
  edition: 3
streams:
  user_profile:
    auto_subscribe: true
    query: select * from profiles where id = auth.user_id()
  owned_trips:
    auto_subscribe: true
    query: select * from trips where owner_id = auth.user_id()
  member_trips:
    auto_subscribe: true
    query: select * from trips where id in (select trip_id from trip_members where user_id = auth.user_id())
  related_memberships:
    auto_subscribe: true
    query: select * from trip_members where user_id = auth.user_id() or trip_id in (select id from trips where owner_id = auth.user_id())
  owned_itinerary:
    auto_subscribe: true
    query: select * from itinerary_items where trip_id in (select id from trips where owner_id = auth.user_id())
  member_itinerary:
    auto_subscribe: true
    query: select * from itinerary_items where trip_id in (select trip_id from trip_members where user_id = auth.user_id())
  trip_quota:
    auto_subscribe: true
    query: select user_id as id, lifetime_trip_count, updated_at from trip_creation_quotas where user_id = auth.user_id()
  verified_entitlement:
    auto_subscribe: true
    query: |
      select id, user_id, product_id, bundle_id, original_transaction_id, transaction_id,
             status, environment, expires_at, revoked_at, signed_at, verified_at,
             verification_source, updated_at
      from iap_entitlements where user_id = auth.user_id()
