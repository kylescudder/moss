name: Moss
options:
  bundleIdPrefix: app.getmoss
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 6AAGJ9Y234
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  PowerSync:
    url: https://github.com/powersync-ja/powersync-swift
    from: 1.15.1
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.6.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.40.0

schemes:
  Moss:
    build:
      targets:
        Moss: all
        MossTests: [test]
    run:
      config: Debug
      executable: Moss
      storeKitConfiguration: Moss/Resources/StoreKit/Moss.storekit
    test:
      targets:
        - MossTests

targets:
  Moss:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Moss
    resources:
      - path: Moss/Resources
        optional: true
    info:
      path: Moss/Info.plist
      properties:
        CFBundleDisplayName: Moss
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Moss uses the camera to attach photos to your travel plans.
        NSLocationWhenInUseUsageDescription: Moss uses your location to help you understand places near your trip.
        NSPhotoLibraryAddUsageDescription: Moss saves the trip memories and exports you choose to create.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - moss
            CFBundleURLName: app.getmoss.moss.auth
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Roboto-Medium.ttf
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        API_URL: $(API_URL)
        POWERSYNC_URL: $(POWERSYNC_URL)
        PUSH_GATEWAY_URL: $(PUSH_GATEWAY_URL)
        PUSH_GATEWAY_APPLICATION_ID: $(PUSH_GATEWAY_APPLICATION_ID)
        SENTRY_DSN: $(SENTRY_DSN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getmoss.moss
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: Moss
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: Moss/Moss.entitlements
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: Moss App Store
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: PowerSync
        product: PowerSync
      - package: Lottie
        product: Lottie
      - package: Sentry
        product: Sentry
      - target: MossWidgets
        embed: true

  MossWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MossWidgets
      - path: Moss/Widgets/WidgetSnapshotStore.swift
      - path: Moss/Widgets/AppGroupStore.swift
    info:
      path: MossWidgets/Info.plist
      properties:
        CFBundleDisplayName: Moss Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getmoss.moss.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: MossWidgets/MossWidgets.entitlements
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: Moss Widgets App Store

  MossTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MossTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getmoss.moss.tests
        GENERATE_INFOPLIST_FILE: YES
        # Every test file imports the app as `AppUnderTest`.
        OTHER_SWIFT_FLAGS: $(inherited) -module-alias AppUnderTest=Moss
    dependencies:
      - target: Moss
